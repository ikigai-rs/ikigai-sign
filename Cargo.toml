[package]
name = "ikigai-sign"
version = "0.4.2"
edition = "2021"
rust-version = "1.87"   # measured: oxrdf/oxrdfio/oxttl 0.x require 1.87; clippy + test pass on 1.87
license = "MIT OR Apache-2.0"
description = "Capability-gated Ed25519 / ES256 signing + verification module for ikigai: `urn:sign:sign` (requires `urn:cap:sign`) turns bytes + a kernel-resolved PKCS8 private key into a deterministic RDF signature-graph (a `sig:Signature` in Turtle; the algorithm follows the key); `urn:sign:verify` (open) parses that graph, recomputes the hash, and verifies against a kernel-resolved SPKI public key, dispatching on the graph's `sig:algorithm`. Keys are standard PKCS8/SPKI (PEM or DER) resolved through the kernel — no keygen here."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-sign"
homepage = "https://github.com/ikigai-rs/ikigai-sign"
keywords = ["ikigai", "roc", "ed25519", "signature", "rdf"]
categories = ["cryptography", "web-programming"]

[dependencies]
# The published kernel, consumed from crates.io — the SAME version the hosts use, so a host
# links exactly one `ikigai-core`. 0.2.0 is the streams release (ledger #2261); the old
# "0.1.89" pin meant >=0.1.89, <0.2.0 under 0.x caret rules, so it could never reach it.
# 0.2.1 is the floor of the body path (`invoke_body`, `content_body`, the run's byte budget);
# 0.2.4 of `ArgSpec::reads_body`. From core 0.2.5 the kernel collects a by-reference argument
# itself unless it is declared `reads_body`, which held a streamed message whole (and refused
# one past the run's budget); every argument read through `content_body` is declared.
ikigai-core = "0.2.4"
async-trait = "0.1"

# Ed25519 (RFC 8032, deterministic signatures) over standard PKCS8/SPKI keys. `pkcs8`+`pem`
# give `from_pkcs8_pem`/`from_pkcs8_der` (private) and `from_public_key_pem`/`_der` (public),
# so an `openssl genpkey -algorithm ed25519` key or a future `urn:secret:*` both load with no
# bespoke encoding. NO `rand_core` — this module never generates keys (that is the secrets
# module's job), so it pulls no RNG. Pure Rust (curve25519-dalek) ⇒ wasm-clean.
#
# `hazmat` is for the BODY path only (ledger #2285): `verify_stream` (one pass) and
# `raw_sign_byupdate` (the two passes Ed25519 signing makes over the message), so a streamed
# message is signed and verified without being held whole. No key material is derived by hand.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem", "hazmat"] }

# ES256 (ECDSA over NIST P-256 + SHA-256) — the SECOND signature algorithm, and the one the
# Apple Secure Enclave / TPMs speak (they cannot hold Ed25519). Signing is RFC-6979
# DETERMINISTIC, so the signature-graph stays content-addressable exactly like Ed25519, and no
# RNG is pulled. `pkcs8`+`pem` load a standard EC private (PKCS8) / public (SPKI) key. Pure Rust
# ⇒ wasm-clean. The module dispatches on `sig:algorithm`, so adding this did not touch Ed25519.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }

# SEC1 (`-----BEGIN EC PRIVATE KEY-----`), the form `openssl ecparam -genkey` writes. Already in
# the graph under p256 (same 0.7 line, so `p256::SecretKey: TryFrom<sec1::EcPrivateKey>` lines
# up); named directly because p256 re-exports neither `EcPrivateKey` nor `EcParameters`, and
# reading the key's curve parameter is the check p256's own SEC1 loader skips. Pure Rust.
sec1 = { version = "0.7.3", default-features = false, features = ["der", "pem"] }

# SHA-256 for `sig:contentHash` (RustCrypto, pure Rust, wasm-clean).
sha2 = "0.10"

# `StreamExt::next`, to read a streamed message body chunk by chunk. Already in the graph under
# ikigai-core (which defines `ByteStream` over it); no executor, wasm-clean.
futures-util = { version = "0.3", default-features = false }

# Base64 for the `sig:signer` (public key) and `sig:value` (signature) literals.
base64 = "0.22"

# The Turtle parser `urn:sign:verify` re-reads the signature-graph with. Oxigraph's pure-Rust
# `oxrdf`/`oxrdfio` are wasm-clean (mirrors ikigai-sexpr's parser deps).
oxrdf = "0.3"
oxrdfio = "0.2"

# Two getrandom versions reach the wasm lib and each needs its wasm backend chosen, or the
# `clippy (wasm lib)` gate won't compile. NEITHER is used at runtime — this crate never
# generates randomness (signing is deterministic); these only satisfy the transitive backends.
#  - 0.3, via oxrdf/oxrdfio: selected by the `getrandom_backend` cfg in .cargo/config.toml
#    plus the `wasm_js` feature here.
#  - 0.2, via p256 → rand_core (the elliptic-curve stack): selected by its `js` feature.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
futures = "0.3" # block_on for the async endpoint tests
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.6.0 added SPACE-NAME (a self-named space
# claims `urn:iki:space:<module>`), 0.7.0 VALIDATE, and 0.8.0 REQUIRED (a dropped required
# input must be refused with a typed MissingArgument), 0.9.0 core 0.1.105's contract-shape
# checks and RECOMPUTE, 0.10.0 FAILURES (off unless a suite opts in), 0.11.0 core 0.2 plus
# DATATYPES and FAILURES on by default (Suite::vocabulary is published from 0.11.0), 0.12.0
# BODIES and BODY-INPUTS on by default (Suite::body_space).
ikigai-conformance = "0.12.0"
